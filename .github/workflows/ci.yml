name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CONAN_VERSION: "2.30.0"
  CLANG_TOOLS_VERSION: "22.1.8"

jobs:
  build-test-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install pinned tooling (conan, clang-format, clang-tidy, ninja)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==${{ env.CONAN_VERSION }}" "clang-format==${{ env.CLANG_TOOLS_VERSION }}" "clang-tidy==${{ env.CLANG_TOOLS_VERSION }}" ninja

      - name: clang-format check
        shell: bash
        run: |
          files=$(git ls-files '*.c' '*.cc' '*.cpp' '*.h' '*.hpp')
          [ -z "$files" ] || clang-format --dry-run -Werror $files

      - name: conan profile detect
        run: conan profile detect --force

      - name: conan install (lean core, locked)
        run: conan install . -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja --lockfile=conan.lock --build=missing

      - name: cmake configure
        run: cmake --preset conan-release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: cmake build
        run: cmake --build --preset conan-release

      - name: clang-tidy check
        shell: bash
        run: |
          files=$(git ls-files '*.cpp' '*.cc')
          [ -z "$files" ] || clang-tidy -p build/Release $files

      - name: ctest
        run: ctest --test-dir build/Release --output-on-failure
