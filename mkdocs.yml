site_name: PCB-IR
site_description: An open intermediate representation framework for PCB physical design and EDA interoperability.
docs_dir: docs
repo_name: pcb-ir

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture: architecture.md
  - File format: format-spec.md
  - C ABI: c-abi.md
  - Conformance: conformance.md
  - Extensions & governance: extensions-governance.md
  - C++ style guide: cpp-style.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
